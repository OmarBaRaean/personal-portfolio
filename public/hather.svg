<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Hather: a phone message checked by a shield" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8b98ad" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="glow" cx="0.68" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#dots)"/>
  <rect width="800" height="400" fill="url(#glow)"/>

  <!-- incoming messages -->
  <g font-family="'Segoe UI', 'Noto Sans Arabic', Tahoma, Arial, sans-serif">
    <rect x="70" y="92" width="330" height="62" rx="18" fill="#111827" stroke="#8b98ad" stroke-opacity="0.25"/>
    <rect x="92" y="112" width="190" height="9" rx="4.5" fill="#8b98ad" fill-opacity="0.55"/>
    <rect x="92" y="130" width="250" height="9" rx="4.5" fill="#8b98ad" fill-opacity="0.35"/>

    <rect x="70" y="172" width="330" height="62" rx="18" fill="#111827" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="92" y="192" width="150" height="9" rx="4.5" fill="#8b98ad" fill-opacity="0.55"/>
    <rect x="92" y="210" width="120" height="9" rx="4.5" fill="#22d3ee" fill-opacity="0.85"/>
    <rect x="220" y="210" width="110" height="9" rx="4.5" fill="#8b98ad" fill-opacity="0.35"/>

    <rect x="70" y="252" width="330" height="62" rx="18" fill="#111827" stroke="#8b98ad" stroke-opacity="0.25"/>
    <rect x="92" y="272" width="220" height="9" rx="4.5" fill="#8b98ad" fill-opacity="0.55"/>
    <rect x="92" y="290" width="170" height="9" rx="4.5" fill="#8b98ad" fill-opacity="0.35"/>

    <!-- scan line from the flagged message to the shield -->
    <path d="M400 203 C 450 203, 470 200, 505 200" fill="none" stroke="url(#acc)" stroke-width="2" stroke-dasharray="5 6"/>

    <!-- shield -->
    <path d="M560 96 L640 124 L640 196 C640 252 604 290 560 308 C516 290 480 252 480 196 L480 124 Z"
          fill="#0a0e18" stroke="url(#acc)" stroke-width="3"/>
    <path d="M528 200 L552 224 L596 176" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="560" y="348" text-anchor="middle" font-size="30" font-weight="700" fill="#e6edf7">حذِر</text>
    <text x="560" y="374" text-anchor="middle" font-size="14" letter-spacing="3" fill="#8b98ad">ON-DEVICE SCAM CHECK</text>
  </g>
</svg>
